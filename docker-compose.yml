services:
  # MongoDB
  mongo:
    image: mongo:5
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - ecommerce-network

  # Consolidated Backend
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGODB_USER_URI=mongodb://mongo:27017/userdb
      - MONGODB_PRODUCT_URI=mongodb://mongo:27017/productdb
      - MONGODB_ORDER_URI=mongodb://mongo:27017/orderdb
      - MONGODB_CART_URI=mongodb://mongo:27017/cartdb
      - MONGODB_CHAT_URI=mongodb://mongo:27017/chatdb
      - MONGODB_VOUCHER_URI=mongodb://mongo:27017/voucherdb
      - MONGODB_COIN_URI=mongodb://mongo:27017/coindb
      - JWT_SECRET=supersecretjwtkey
      - JWT_EXPIRE=7d
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-sk_test_your_stripe_key}
    depends_on:
      - mongo
    volumes:
      - ./backend/src:/app/src
      - backend-uploads:/app/uploads
    networks:
      - ecommerce-network
    command: npm run dev

  # Frontend (Development)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - ecommerce-network
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mongo_data:
  backend-uploads:

networks:
  ecommerce-network:
    driver: bridge
