services:
  # MongoDB
  mongo:
    image: mongo:5
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - ecommerce-network

  # Product Service
  product-service:
    build: ./product-service
    ports:
      - "3001:3001"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/productdb
      - JWT_SECRET=supersecretjwtkey
      - JWT_EXPIRE=7d
    depends_on:
      - mongo
    networks:
      - ecommerce-network

  # User Service
  user-service:
    build: ./user-service
    ports:
      - "3002:3002"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/userdb
      - JWT_SECRET=supersecretjwtkey
      - JWT_EXPIRE=7d
    depends_on:
      - mongo
    networks:
      - ecommerce-network

  # Order Service
  order-service:
    build: ./order-service
    ports:
      - "3003:3003"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/orderdb
      - JWT_SECRET=supersecretjwtkey
    depends_on:
      - mongo
    networks:
      - ecommerce-network

  # Cart Service
  cart-service:
    build: ./cart-service
    ports:
      - "3004:3004"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/cartdb
      - JWT_SECRET=supersecretjwtkey
    depends_on:
      - mongo
    networks:
      - ecommerce-network

  # Payment Service
  payment-service:
    build: ./payment-service
    ports:
      - "3005:3005"
    environment:
      # Do NOT commit production secrets here. Provide STRIPE_SECRET_KEY via an external .env file
      # Example using an env file: docker-compose --env-file .env.dev up
      - STRIPE_SECRET_KEY
    networks:
      - ecommerce-network

  # API Gateway
  api-gateway:
    build: ./api-gateway
    ports:
      - "3000:3000"
    depends_on:
      - product-service
      - user-service
      - order-service
      - cart-service
      - payment-service
    networks:
      - ecommerce-network

  # Frontend (Development)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    depends_on:
      - api-gateway
    networks:
      - ecommerce-network
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mongo_data:

networks:
  ecommerce-network:
    driver: bridge